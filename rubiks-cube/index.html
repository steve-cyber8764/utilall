<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>if(location.hostname==='www.utilall.net'){location.replace('https://utilall.net'+location.pathname+location.search+location.hash);}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>큐브 솔버 — UtilAll | 2×2~20×20 큐브 자동 풀이</title>
<meta name="description" content="2×2부터 20×20까지 큐브를 섞고, 센터·모서리·코너 단계별 목표를 보면서 한 단계씩 자동으로 맞추는 과정을 3D로 보는 무료 큐브 솔버.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://utilall.net/rubiks-cube/">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://utilall.net/rubiks-cube/">
<meta property="og:title" content="큐브 솔버 — UtilAll">
<meta property="og:description" content="2×2~20×20 큐브를 단계별 목표와 함께 자동으로 맞추는 3D 큐브 솔버.">
<meta property="og:site_name" content="UtilAll">
<meta property="og:image" content="https://utilall.net/og-image.png">
<style>
  body{margin:0;background:#1d2128;color:#eee;font-family:system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:rgba(0,0,0,.45);z-index:1}
  button,select{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #555;background:#2d333d;color:#eee;cursor:pointer}
  button:disabled,select:disabled{opacity:.4;cursor:default}
  #status{margin-left:auto;font-weight:600}
  #home{color:#fff;font-weight:800;text-decoration:none;padding:6px 8px}
  #goal{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;
        padding:12px 20px;border-radius:10px;background:rgba(0,0,0,.55);text-align:center;pointer-events:none}
  #goalText{font-size:20px;font-weight:700}
  #goalSub{margin-top:4px;font-size:14px;color:#bbb}
  #help{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#888;font-size:13px;pointer-events:none}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<div id="bar">
  <a id="home" href="/" title="UtilAll 홈으로">⚡ UtilAll</a>
  <label>크기 <select id="size"></select></label>
  <button id="scramble">랜덤 섞기</button>
  <button id="reset">초기화</button>
  <label>속도
    <select id="speed">
      <option value="1500">매우 느림</option>
      <option value="800">느림</option>
      <option value="400" selected>보통</option>
      <option value="150">빠름</option>
      <option value="40">매우 빠름</option>
      <option value="0">순간 (애니메이션 없음)</option>
    </select>
  </label>
  <button id="play">▶ 맞추기 시작</button>
  <button id="step">한 단계</button>
  <span id="status"></span>
</div>
<div id="goal"><div id="goalText"></div><div id="goalSub"></div></div>
<div id="help">스티커를 드래그하면 그 줄이 돌아갑니다 · 빈 곳 드래그: 시점 회전 · 휠: 확대/축소</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="solver.js"></script>
<script>
// 면 순서: +x(R) -x(L) +y(U) -y(D) +z(F) -z(B) — solver.js와 같다
const COLORS = [0xc41e3a, 0xff6a00, 0xffffff, 0xffd500, 0x009b48, 0x0046ad];
const INNER = 0x111111;
const AX = ['x', 'y', 'z'];
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2128);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 2000);
scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.45);
light.position.set(3, 5, 2);
camera.add(light);
const material = new THREE.MeshLambertMaterial({ vertexColors: true });

let N = 3, off = 1, md, cstate, cubies = [], queue = [], anim = null, playing = false, plan = null, computing = false;
const view = { theta: 0.6, phi: 0.95, dist: 14 };
const speed = () => +$('speed').value;

function build(n) {
  if (anim) scene.remove(anim.pivot);
  cubies.forEach(c => { scene.remove(c); c.geometry.dispose(); });
  cubies = []; queue = []; anim = null; playing = false; plan = null;
  N = n; off = (n - 1) / 2;
  md = CubeSolver.Model(n);
  cstate = md.solvedState();
  const base = new THREE.BoxGeometry(0.94, 0.94, 0.94);
  const col = new THREE.Color();
  for (let x = 0; x < n; x++) for (let y = 0; y < n; y++) for (let z = 0; z < n; z++) {
    const p = [x, y, z];
    if (!p.some(v => v === 0 || v === n - 1)) continue; // 안쪽 큐브는 안 보이므로 생략
    const outer = [], colors = new Float32Array(24 * 3);
    for (let f = 0; f < 6; f++) {
      const a = f >> 1, isOuter = f % 2 === 0 ? p[a] === n - 1 : p[a] === 0;
      if (isOuter) outer.push(f);
      col.setHex(isOuter ? COLORS[f] : INNER);
      for (let v = f * 4; v < f * 4 + 4; v++) col.toArray(colors, v * 3); // BoxGeometry: 면마다 정점 4개
    }
    const g = base.clone();
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mesh = new THREE.Mesh(g, material);
    mesh.position.set(x - off, y - off, z - off);
    mesh.userData.outer = outer;
    scene.add(mesh); cubies.push(mesh);
  }
  base.dispose();
  view.dist = n * 2.6 + 6;
  updateUI();
}

const angleOf = q => (q === 3 ? -1 : q) * Math.PI / 2;
const toInt = mv => md.enc(AX.indexOf(mv.axis), mv.layer, mv.q);
const fromInt = m => { const [a, layer, q] = md.dec(m); return { axis: AX[a], layer, q }; };

function startMove(it) {
  const pivot = new THREE.Object3D();
  scene.add(pivot);
  const layer = cubies.filter(c => Math.round(c.position[it.mv.axis] + off) === it.mv.layer);
  layer.forEach(c => pivot.attach(c));
  anim = { ...it, pivot, layer, t0: performance.now(), dur: it.mv.q === 2 ? it.dur * 1.5 : it.dur };
}

function snap(c) {
  AX.forEach(a => c.position[a] = Math.round(c.position[a] + off) - off);
  const m = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
  m.elements = m.elements.map(Math.round);
  c.quaternion.setFromRotationMatrix(m);
}

function finishMove() {
  const { pivot, layer, mv, fromPlan } = anim;
  pivot.rotation[mv.axis] = angleOf(mv.q);
  pivot.updateMatrixWorld();
  layer.forEach(c => { scene.attach(c); snap(c); });
  scene.remove(pivot);
  anim = null;
  md.apply(cstate, toInt(mv));
  if (!fromPlan) plan = null; // 사용자가 직접 돌리면 기존 풀이는 무효
  updateUI();
}

// ---- 풀이 계획 ----
function makePlan() {
  const stages = CubeSolver.solve(md, cstate);
  const steps = [], stageStart = [];
  stages.forEach((s, si) => { stageStart.push(steps.length); s.moves.forEach(m => steps.push({ m, si })); });
  return { stages, steps, stageStart, i: 0 };
}

function ensurePlan(then) {
  if (plan && plan.i < plan.steps.length) return then();
  if (md.isSolved(cstate) || busy() || computing) return;
  computing = true; updateUI();
  setTimeout(() => { // 화면에 "계산 중"을 먼저 그린 뒤 계산
    try { plan = makePlan(); } catch (e) { console.error(e); plan = null; $('goalText').textContent = '풀이를 찾지 못했습니다.'; }
    computing = false;
    if (plan) then();
    updateUI();
  }, 30);
}

function planItem() {
  if (!plan || plan.i >= plan.steps.length) return null;
  const s = plan.steps[plan.i++];
  return { mv: fromInt(s.m), dur: speed(), fromPlan: true };
}

function nextItem() {
  if (queue.length) return queue.shift();
  if (!playing) return null;
  const it = planItem();
  if (!it) { playing = false; updateUI(); }
  return it;
}

function busy() { return !!anim || queue.length > 0; }

function updateUI() {
  const solved = md.isSolved(cstate);
  const left = plan ? plan.steps.length - plan.i : 0;
  $('status').textContent = computing ? '계산 중…' : solved ? '✅ 맞춰진 상태' : plan ? `남은 회전: ${left}` : '섞인 상태';
  $('play').textContent = playing ? '⏸ 일시정지' : '▶ 맞추기 시작';
  $('play').disabled = computing || (solved && !playing);
  $('step').disabled = computing || solved || playing;
  $('scramble').disabled = computing || playing;
  $('size').disabled = computing;

  let text, sub = '';
  if (computing) text = '풀이를 계산하는 중입니다…';
  else if (plan && plan.i > 0 && left === 0 && !anim) { text = '🎉 완성! 모든 목표를 달성했습니다.'; sub = `총 ${plan.stages.length}개 목표 · ${plan.steps.length}회전`; }
  else if (plan && (plan.i > 0 || left)) {
    const cur = anim && anim.fromPlan ? plan.i - 1 : plan.i; // 지금 돌고 있거나 다음에 돌 회전
    const si = plan.steps[Math.min(cur, plan.steps.length - 1)].si;
    const stage = plan.stages[si], done = plan.i - plan.stageStart[si];
    text = `현재 목표: ${stage.goal}`;
    sub = `목표 ${si + 1}/${plan.stages.length} · 이 목표의 회전 ${done}/${stage.moves.length} · 남은 회전 ${left}`;
  } else if (solved) text = '맞춰진 상태입니다. 섞은 뒤 ‘맞추기 시작’을 누르세요.';
  else text = '‘맞추기 시작’ 또는 ‘한 단계’를 누르면 목표가 여기에 표시됩니다.';
  $('goalText').textContent = text;
  $('goalSub').textContent = sub;
}

function scramble() {
  plan = null;
  const count = 20 + N * 4, dur = N <= 9 ? 70 : 25;
  let prev = null;
  for (let i = 0; i < count; i++) {
    let mv;
    do mv = { axis: AX[Math.random() * 3 | 0], layer: Math.random() * N | 0, q: 1 + (Math.random() * 3 | 0) };
    while (prev && prev.axis === mv.axis && prev.layer === mv.layer);
    queue.push({ mv, dur });
    prev = mv;
  }
  updateUI();
}

function tick(now) {
  if (anim) {
    const t = anim.dur ? Math.min(1, (now - anim.t0) / anim.dur) : 1;
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    anim.pivot.rotation[anim.mv.axis] = angleOf(anim.mv.q) * e;
    if (t >= 1) finishMove();
  }
  // '순간' 속도는 한 프레임에 여러 회전을 바로 처리
  let budget = Math.max(5, 400 / N | 0);
  while (!anim && budget-- > 0) {
    const it = nextItem();
    if (!it) break;
    startMove(it);
    if (it.dur > 0) break;
    finishMove();
  }
  const { theta, phi, dist } = view;
  camera.position.set(dist * Math.sin(phi) * Math.sin(theta), dist * Math.cos(phi), dist * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---- 마우스/터치 ----
const ray = new THREE.Raycaster();
let drag = null;

function pick(e) {
  if (busy() || playing || computing) return null; // 회전 중엔 층 위치가 확정되지 않으므로 시점 회전만
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = ray.intersectObjects(cubies, false)[0];
  if (!hit) return null;
  const ln = hit.face.normal, f = ln.x > 0.5 ? 0 : ln.x < -0.5 ? 1 : ln.y > 0.5 ? 2 : ln.y < -0.5 ? 3 : ln.z > 0.5 ? 4 : 5;
  if (!hit.object.userData.outer.includes(f)) return null;
  const n = ln.clone().transformDirection(hit.object.matrixWorld);
  AX.forEach(a => n[a] = Math.round(n[a]));
  return { obj: hit.object, point: hit.point, n };
}

function dragToMove(hit, dx, dy) {
  let best = null;
  for (const a of AX) {
    const v = new THREE.Vector3(); v[a] = 1;
    if (Math.abs(v.dot(hit.n)) > 0.5) continue;
    const s0 = hit.point.clone().project(camera), s1 = hit.point.clone().add(v).project(camera);
    const sx = (s1.x - s0.x) * innerWidth, sy = -(s1.y - s0.y) * innerHeight;
    const dot = (sx * dx + sy * dy) / Math.hypot(sx, sy) / Math.hypot(dx, dy);
    if (!best || Math.abs(dot) > Math.abs(best.dot)) best = { v, dot };
  }
  const d = best.v.multiplyScalar(Math.sign(best.dot));
  const r = new THREE.Vector3().crossVectors(hit.n, d); // 회전축: 면 법선 × 드래그 방향
  const axis = AX.find(a => Math.abs(r[a]) > 0.5);
  queue.push({ mv: { axis, layer: Math.round(hit.obj.position[axis] + off), q: r[axis] > 0 ? 1 : 3 }, dur: Math.min(speed() || 150, 250) });
}

canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, hit: pick(e), done: false };
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.hit) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.done && Math.hypot(dx, dy) > 12) { drag.done = true; dragToMove(drag.hit, dx, dy); }
  } else {
    view.theta -= (e.clientX - drag.lx) * 0.008;
    view.phi = Math.min(Math.PI - 0.1, Math.max(0.1, view.phi - (e.clientY - drag.ly) * 0.008));
    drag.lx = e.clientX; drag.ly = e.clientY;
  }
});
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('pointercancel', () => drag = null);
canvas.addEventListener('wheel', e => { e.preventDefault(); view.dist = Math.min(150, Math.max(4, view.dist * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---- 버튼 ----
for (let n = 2; n <= 20; n++) $('size').add(new Option(`${n}×${n}`, n, false, n === 3));
$('size').onchange = () => build(+$('size').value);
$('reset').onclick = () => { if (!computing) build(N); };
$('scramble').onclick = scramble;
$('play').onclick = () => {
  if (playing) { playing = false; updateUI(); return; }
  ensurePlan(() => { playing = true; updateUI(); });
};
$('step').onclick = () => ensurePlan(() => { const it = planItem(); if (it) queue.push(it); updateUI(); });

resize();
build(3);
requestAnimationFrame(tick);
</script>
</body>
</html>
